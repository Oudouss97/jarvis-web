<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGen - Générateur de Fiches Pédagogiques</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Edu<span>Gen</span></h1>
            <div class="nav-links">
                <a href="#" class="active">Générateur</a>
                <a href="#" id="nav-my-fiches">Mes Fiches</a>
                <span id="auth-section">
                    <a href="#" id="btn-login">Connexion</a>
                </span>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Section Auth (cachée par défaut) -->
        <section id="auth-card" class="generator-card hidden" style="max-width: 400px; margin: 0 auto 3rem auto;">
            <h3 style="text-align: center; margin-bottom: 1.5rem;">Connexion / Inscription</h3>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="auth-email" placeholder="email@exemple.com">
            </div>
            <div class="form-group" style="margin-top: 1rem;">
                <label>Mot de passe</label>
                <input type="password" id="auth-password" placeholder="••••••••">
            </div>
            <button id="btn-auth-submit" class="btn-generate" style="margin-top: 1.5rem;">Se connecter / S'inscrire</button>
        </section>

        <section class="hero">
            <h2>Créez vos fiches pédagogiques en un instant</h2>
            <p>Saisissez vos mots-clés et laissez l'IA concevoir une fiche conforme aux normes de l'inspection.</p>
        </section>

        <section class="generator-card">
            <form id="fiche-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="discipline">Discipline</label>
                        <input type="text" id="discipline" placeholder="ex: Éducation Environnementale" required>
                    </div>
                    <div class="form-group">
                        <label for="level">Niveau / Section</label>
                        <select id="level" required>
                            <option value="">Sélectionnez le niveau</option>
                            <option value="PS">Petite Section (PS)</option>
                            <option value="MS">Moyenne Section (MS)</option>
                            <option value="GS">Grande Section (GS)</option>
                            <option value="CI">CI</option>
                            <option value="CP">CP</option>
                            <option value="CE1">CE1</option>
                            <option value="CE2">CE2</option>
                            <option value="CM1">CM1</option>
                            <option value="CM2">CM2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="theme">Thème / Contenu du jour</label>
                        <input type="text" id="theme" placeholder="ex: Comment traverser la chaussée ?" required>
                    </div>
                    <div class="form-group">
                        <label for="duration">Durée (minutes)</label>
                        <input type="number" id="duration" placeholder="ex: 30" required>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="context">Notes complémentaires (Optionnel)</label>
                    <textarea id="context" rows="3" placeholder="Précisez des objectifs particuliers ou du matériel spécifique..."></textarea>
                </div>

                <button type="submit" class="btn-generate">
                    <span>Générer la fiche pédagogique</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </button>
            </form>
        </section>

        <section id="result-section" class="hidden">
            <div class="result-header">
                <h3>Fiche Générée</h3>
                <div class="result-actions">
                    <button id="btn-edit" class="btn-secondary" aria-label="Modifier la fiche générée">Modifier</button>
                    <button id="btn-download" class="btn-primary" aria-label="Télécharger la fiche en format PDF">Télécharger PDF</button>
                </div>
            </div>
            <div id="fiche-output" class="fiche-content">
                <!-- Le contenu généré sera inséré ici -->
            </div>
        </section>
    </main>

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/main.js"></script>
</body>
</html>
