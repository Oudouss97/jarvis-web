<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - EduGen</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--background);
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .auth-card h2 {
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        .auth-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }
        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="logo" style="font-size: 2rem; margin-bottom: 0.5rem;">Edu<span style="color: var(--primary);">Gen</span></h2>
            <p>Rejoignez la communauté des enseignants innovateurs</p>

            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="full_name">Nom complet</label>
                    <input type="text" id="full_name" placeholder="Jean Dupont" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="enseignant@exemple.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-register" class="btn-generate">
                    Créer mon compte
                </button>
            </form>

            <div class="auth-footer">
                Déjà un compte ? <a href="login.html">Connectez-vous ici</a>
            </div>
        </div>
    </div>

    <!-- 1. Chargement du SDK Supabase en premier -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Chargement de la logique d'authentification après -->
    <script src="js/auth.js"></script>
</body>
</html>
